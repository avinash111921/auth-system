server:
  port: 8082

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s
      #      lettuce:
      #        pool:
      #          max-active: 16
      #          max-idle: 8
      #          min-idle: 2
      database: 0

jwt:
  issuer: auth-platform
  key-encryption-secret: ${JWT_KEY_ENCRYPTION_SECRET}
  accessTtl: 900
  refreshTtl: 2592000
  key-rotation:
    rotate-delay-ms: 21600000
    cleanup-delay-ms: 3600000
    rotate-every-hours: 6
    retain-old-keys-hours: 24
    max-keys: 10


shedlock:
  enabled: true
  table-name: shedlock
  lock-at-most-for: 5m
  lock-at-least-for: 30s

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

grpc:
  server:
    port: 9091

service-auth:
  trusted-callers:
    identity-service:
      secret: ${SERVICE_AUTH_IDENTITY_SECRET}
      allowed-services:
        - auth.token.v1.TokenService