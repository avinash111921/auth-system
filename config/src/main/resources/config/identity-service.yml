server:
  port: 8081

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s
#      lettuce:
#        pool:
#          max-active: 16
#          max-idle: 8
#          min-idle: 2
      database: 2

  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: {DB_USERNAME}
    password: {DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8082/.well-known/jwks.json

auth:
  jwt:
    issuer : auth-platform
  device-cookie:
    secret: ${SERVICE_AUTH_IDENTITY_SECRET}

service-auth:
  service-name: identity-service
  secret: ${SERVICE_AUTH_IDENTITY_SECRET}

grpc:
  client:
    otp:
      address: discovery:///otp
      negotiationType: plaintext
    token-service:
      address: discovery:///token-service
      negotiationType: plaintext
    risk-service:
      address: discovery:///risk-service
      negotiationType: plaintext

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true


# Producer sends message
#Leader broker writes it
#All ISR replicas replicate it
#✅ ACK sent back to producer