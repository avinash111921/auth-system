server:
  port: 8081

spring:
#  application:
#    name: identity-service

  data:
    redis:
      host: redis_container
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
      database: 2

  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: avi
    password: avi1921
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    properties:
      spring.json.add.type.headers: false

grpc:
  client:
    otp:
      address: discovery:///otp
      negotiationType: plaintext

    token-service:
      address: discovery:///token-service
      negotiationType: plaintext

    security:
        address: discovery:///security
        negotiationType: plaintext

    risk-service:
      address: discovery:///risk-service
      negotiationType: plaintext

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true


# Producer sends message
#Leader broker writes it
#All ISR replicas replicate it
#✅ ACK sent back to producer