server:
  port: 8081
  # Trust X-Forwarded-For only from internal proxies (the gateway), so getRemoteAddr() is the real client.
  forward-headers-strategy: native

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s
      database: 2

  datasource:
    url: jdbc:postgresql://localhost:5432/authsystem
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8082/.well-known/jwks.json

auth:
  jwt:
    issuer : auth-platform
  device-cookie:
    secret: ${DEVICE_COOKIE_SECRET}
    name: ${DEVICE_COOKIE_NAME:__Host-device}
    secure: ${DEVICE_COOKIE_SECURE:true}
  server-timing:
    enabled: ${SERVER_TIMING_ENABLED:false}

service-auth:
  service-name: identity-service
  secret: ${SERVICE_AUTH_IDENTITY_SECRET}

grpc:
  client:
    otp:
      address: discovery:///otp
      negotiationType: plaintext
    token-service:
      address: discovery:///token-service
      negotiationType: plaintext
    risk-service:
      address: discovery:///risk-service
      negotiationType: plaintext

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
