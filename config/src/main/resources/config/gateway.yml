server:
  port: 8080

spring:
#  application:
#    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/.well-known/jwks.json

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**

#        - id : otp-service
#          uri: lb://otp-service
#          predicates:
#            - Path=/otp/**

#        - id: token-service
#          uri: lb://token-service
#          predicates:
#            - Path=/token/**

        - id: jwks
          uri: lb://token-service
          predicates:
            - Path=/.well-known/jwks.json

#        - id : security
#          uri: lb://security
#          predicates:
#            - Path=/security/**
#
#        - id : risk-service
#          uri: lb://risk-service
#          predicates:
#            - Path=/risk/**

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true