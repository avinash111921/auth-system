syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.risk.grpc";
option java_outer_classname = "RiskProto";

service RiskService {
  rpc AssessLogin (AssessLoginRequest) returns (AssessLoginResponse);
}

message AssessLoginRequest {
  string user_id = 1;
  string device_id = 2;
  string ip = 3;
}

message AssessLoginResponse {
  RiskLevel level = 1;
  int32 score = 2;
  repeated string reasons = 3;
}

enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_LOW = 1;
  RISK_LEVEL_MEDIUM = 2;
  RISK_LEVEL_HIGH = 3;
}