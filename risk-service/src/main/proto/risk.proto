syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.risk.grpc";
option java_outer_classname = "RiskProto";

service RiskService {

  rpc AssessRisk (RiskRequest) returns (RiskResponse);

  rpc RecordFailure (FailureRequest) returns (Empty);

  rpc TrustContext (TrustRequest) returns (Empty);
}

message RiskRequest {
  string userId = 1;
  string deviceFingerprint = 2;
  string ip = 3;
}

message RiskResponse {
  RiskLevel level = 1;
  int32 score = 2;
}

message FailureRequest {
  string userId = 1;
}

message Empty {}

enum RiskLevel {
  LOW = 0;
  MEDIUM = 1;
  HIGH = 2;
}

message TrustRequest {
  string userId = 1;
  string deviceFingerprint = 2;
  string ip = 3;
}