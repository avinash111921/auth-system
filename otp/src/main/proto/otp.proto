syntax = "proto3";

package auth.otp.v1;

option java_multiple_files = true;
option java_package = "com.otp.grpc";
option java_outer_classname = "OtpProto";

service OtpService {
  rpc Verify (VerifyRequest) returns (VerifyResponse);
}

enum Purpose {
  PURPOSE_UNSPECIFIED = 0;
  PURPOSE_REGISTRATION = 1;
  PURPOSE_PASSWORD_RESET = 2;
  PURPOSE_LOGIN = 3;
}

message VerifyRequest {
  Purpose purpose = 1;
  string subject = 2;
  string code = 3;
}

message VerifyResponse {
  bool valid = 1;
}