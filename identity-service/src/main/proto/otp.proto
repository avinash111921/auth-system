syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.otp.grpc";
option java_outer_classname = "OtpProto";

service OtpService {

  rpc verifyOtp (OtpVerifyRequest) returns (OtpVerifyResponse);

  rpc VerifyPasswordResetOtp (OtpVerifyRequest) returns (OtpVerifyResponse);

  rpc verifyLoginOtp (VerifyLoginOtpRequest) returns (VerifyLoginOtpResponse);
}


message OtpVerifyRequest {
  string email = 1;
  string otp = 2;
}

message OtpVerifyResponse {
  bool valid = 1;
}

message VerifyLoginOtpRequest {
  string email = 1;
  string challengeId = 2;
  string otp         = 3;
}

message VerifyLoginOtpResponse {
  bool valid = 1;
}