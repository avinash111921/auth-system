syntax = "proto3";

package auth.token.v1;

import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "com.token_service.grpc";
option java_outer_classname = "TokenProto";

service TokenService {
  rpc IssueToken(IssueTokenRequest) returns (TokenPair);
  rpc RefreshToken(RefreshTokenRequest) returns (TokenPair);
  rpc RevokeToken(RevokeTokenRequest) returns (google.protobuf.Empty);
  rpc RevokeAllTokens(RevokeAllTokensRequest) returns (google.protobuf.Empty);
}

message IssueTokenRequest {
  string user_id = 1;
  string device_id = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  string device_id = 2;
}

message RevokeTokenRequest {
  string refresh_token = 1;
}

message RevokeAllTokensRequest {
  string user_id = 1;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}
