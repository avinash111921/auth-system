syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.security.grpc";
option java_outer_classname = "SecurityProto";

service SecurityService {

  rpc passwordEncode (EncodeRequest) returns (EncodeResponse);

  rpc passwordVerify (VerifyRequest) returns (VerifyResponse);

}

message EncodeRequest {
  string password = 1;
}

message EncodeResponse {
  string encodedPassword = 1;
}

message VerifyRequest {
  string password = 1;
  string encodedPassword = 2;
}

message VerifyResponse {
  bool isMatch = 1;
}
